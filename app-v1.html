<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* =========================================================
   FIREBASE CONFIG
   ========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCP0TMQjJ4nlofmVkmIS9G5aAAkFafHMV4",

  authDomain:
    "rinsaathi-app.firebaseapp.com",

  projectId:
    "rinsaathi-app",

  storageBucket:
    "rinsaathi-app.firebasestorage.app",

  messagingSenderId:
    "156758734237",

  appId:
    "1:156758734237:web:b2daa2fb6e43a7bc192b74"

};


/* =========================================================
   INITIALIZE FIREBASE
   ========================================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


/* =========================================================
   VARIABLES
   ========================================================= */

let confirmationResult = null;

let recaptchaVerifier = null;


/* =========================================================
   LOGIN MESSAGE
   ========================================================= */

function setLoginMessage(message, type = "") {

  const box =
    document.getElementById("loginMessage");

  if (!box) return;

  box.innerText =
    message;

  box.className =
    "loginMessage " + type;

}


/* =========================================================
   CREATE RECAPTCHA
   ========================================================= */

function createRecaptcha() {

  const container =
    document.getElementById("recaptcha-container");

  if (!container) return;


  /* Remove old reCAPTCHA completely */

  if (recaptchaVerifier) {

    try {
      recaptchaVerifier.clear();
    } catch (e) {
      console.log("Old reCAPTCHA clear error:", e);
    }

    recaptchaVerifier = null;

  }


  container.innerHTML = "";


  /* Create fresh verifier */

  recaptchaVerifier =
    new RecaptchaVerifier(
      auth,
      "recaptcha-container",
      {

        size: "normal",

        callback: function(response) {

          console.log(
            "reCAPTCHA verified"
          );

        },

        "expired-callback": function() {

          setLoginMessage(
            "reCAPTCHA expired. Please verify again.",
            "error"
          );

        }

      }
    );


  /* Render it */

  recaptchaVerifier.render()
    .then(function(widgetId) {

      window.recaptchaWidgetId =
        widgetId;

      console.log(
        "reCAPTCHA rendered:",
        widgetId
      );

    })
    .catch(function(error) {

      console.error(
        "reCAPTCHA render error:",
        error
      );

      setLoginMessage(
        "Unable to load security verification. Please refresh the page.",
        "error"
      );

    });

}


/* =========================================================
   RESET RECAPTCHA
   ========================================================= */

function resetRecaptcha() {

  try {

    if (
      window.grecaptcha &&
      window.recaptchaWidgetId !== undefined
    ) {

      window.grecaptcha.reset(
        window.recaptchaWidgetId
      );

    }

  } catch (e) {

    console.log(
      "reCAPTCHA reset error:",
      e
    );

  }

}


/* =========================================================
   SEND OTP
   ========================================================= */

window.sendOTP =
async function() {

  const phoneInput =
    document.getElementById("loginPhone");


  const phone =
    phoneInput.value.trim();


  if (!/^[6-9]\d{9}$/.test(phone)) {

    setLoginMessage(
      "Please enter a valid 10-digit Indian mobile number.",
      "error"
    );

    return;

  }


  const fullPhone =
    "+91" + phone;


  try {

    setLoginMessage(
      "Please complete the security verification..."
    );


    /* Make sure reCAPTCHA exists */

    if (!recaptchaVerifier) {

      createRecaptcha();

      await new Promise(
        resolve =>
          setTimeout(resolve, 1000)
      );

    }


    /* Get current verifier */

    const appVerifier =
      recaptchaVerifier;


    if (!appVerifier) {

      throw new Error(
        "Security verification is not ready."
      );

    }


    setLoginMessage(
      "Sending OTP..."
    );


    /* Send OTP */

    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        fullPhone,
        appVerifier
      );


    /* OTP successfully sent */

    document.getElementById(
      "phoneSection"
    ).style.display =
      "none";


    document.getElementById(
      "otpSection"
    ).style.display =
      "block";


    setLoginMessage(
      "OTP sent successfully. Please check your SMS.",
      "success"
    );


  } catch (error) {

    console.error(
      "SEND OTP ERROR:",
      error
    );


    /* Reset reCAPTCHA after failed request */

    resetRecaptcha();


    let message =
      "Unable to send OTP. Please try again.";


    if (error && error.code) {

      message +=
        "\n\nFirebase: " +
        error.code;

    }


    setLoginMessage(
      message,
      "error"
    );

  }

};


/* =========================================================
   VERIFY OTP
   ========================================================= */

window.verifyOTP =
async function() {

  const otpInput =
    document.getElementById("otpCode");


  const otp =
    otpInput.value.trim();


  if (!/^\d{6}$/.test(otp)) {

    setLoginMessage(
      "Please enter the 6-digit OTP.",
      "error"
    );

    return;

  }


  /* IMPORTANT */

  if (!confirmationResult) {

    setLoginMessage(
      "This OTP session has expired. Please request a new OTP.",
      "error"
    );

    return;

  }


  try {

    setLoginMessage(
      "Verifying OTP..."
    );


    /* Firebase verifies the OTP here */

    const result =
      await confirmationResult.confirm(
        otp
      );


    console.log(
      "OTP VERIFIED:",
      result.user
    );


    setLoginMessage(
      "Login successful!",
      "success"
    );


  } catch (error) {

    console.error(
      "OTP VERIFY ERROR:",
      error
    );


    let message =
      "OTP verification failed.";


    if (error && error.code) {

      message +=
        "\nFirebase: " +
        error.code;

    }


    /*
       DO NOT automatically destroy confirmationResult
       for every error.

       A temporary network failure should not invalidate
       the current OTP session.
    */


    setLoginMessage(
      message,
      "error"
    );

  }

};


/* =========================================================
   CHANGE MOBILE NUMBER
   ========================================================= */

window.backToPhone =
function() {

  document.getElementById(
    "otpSection"
  ).style.display =
    "none";


  document.getElementById(
    "phoneSection"
  ).style.display =
    "block";


  document.getElementById(
    "otpCode"
  ).value =
    "";


  confirmationResult =
    null;


  setLoginMessage("");


  createRecaptcha();

};


/* =========================================================
   AUTH STATE
   ========================================================= */

onAuthStateChanged(
  auth,
  function(user) {

    const loginScreen =
      document.getElementById(
        "loginScreen"
      );


    const mainApp =
      document.getElementById(
        "mainApp"
      );


    if (user) {

      loginScreen.style.display =
        "none";


      mainApp.style.display =
        "block";


      console.log(
        "Logged in:",
        user.phoneNumber
      );


    } else {

      loginScreen.style.display =
        "flex";


      mainApp.style.display =
        "none";

    }

  }
);


/* =========================================================
   LOGOUT
   ========================================================= */

window.logoutUser =
async function() {

  try {

    await signOut(auth);

    location.reload();

  } catch (error) {

    console.error(
      "Logout error:",
      error
    );

  }

};


/* =========================================================
   START RECAPTCHA
   ========================================================= */

createRecaptcha();

</script>
